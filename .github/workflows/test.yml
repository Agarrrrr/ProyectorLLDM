name: Tests Multiplataforma (Windows, macOS, Linux)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Configurar Python 3 y PyMuPDF
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar PyMuPDF para pruebas de PDF
        run: python -m pip install pymupdf

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite de pruebas
        run: npm test

      - name: Empaquetar distribución ZIP y verificar permisos Unix
        run: |
          python scripts/package-release.py
          python -c "
          import json, zipfile
          from pathlib import Path
          version = json.loads(Path('package.json').read_text(encoding='utf-8'))['version']
          zf = zipfile.ZipFile(f'output/Proyector-LLDM-{version}.zip')
          for script in ('Iniciar Proyector LLDM.command', 'Iniciar Proyector LLDM.sh'):
              info = zf.getinfo(f'Proyector-LLDM-{version}/{script}')
              assert info.create_system == 3, f'{script} create_system != 3'
              assert (info.external_attr >> 16) == 0o100755, f'{script} permisos != 0755'
              assert b'\r\n' not in zf.read(info), f'{script} contiene CRLF'
          print('ZIP verificado correctamente para Windows, macOS y Linux:', f'Proyector-LLDM-{version}.zip')
          "

      - name: Subir artefacto ZIP (en Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Proyector-LLDM-Release-ZIP
          path: output/Proyector-LLDM-*.zip
