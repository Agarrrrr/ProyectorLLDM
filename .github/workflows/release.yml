name: Publicar ZIP de Proyector LLDM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta existente que se publicará (por ejemplo, v1.4.6)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Crear ZIP y publicarlo en Releases
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código de la etiqueta
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar que la etiqueta coincida con la versión
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="v$(python -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
          if [[ "$RELEASE_TAG" != "$VERSION" ]]; then
            echo "La etiqueta $RELEASE_TAG no coincide con package.json ($VERSION)." >&2
            exit 1
          fi

      - name: Crear ZIP de distribución
        run: python scripts/package-release.py

      - name: Publicar o actualizar el Release con el ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ASSET="output/Proyector-LLDM-${RELEASE_TAG#v}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" \
              --title "Proyector LLDM ${RELEASE_TAG#v}" \
              --generate-notes
          fi
