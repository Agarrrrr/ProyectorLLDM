            <!-- Dates & Configuration -->

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"></svg> Guardar Semana
                </button>
                <button class="action-btn btn-outline" onclick="downloadAllFlyersZip()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/><line x1="12" y1="12" x2="20.5" y2="7.05"/><line x1="12" y1="12" x2="3.5" y2="7.05"></svg> Descargar ZIP 4K (6 Flyers)
                </button>
            </div>

            <!-- History of Saved Weeks -->
            <div class="sidebar-card">
                <h3>Historial de Semanas</h3>
                <ul class="history-list" id="saved-weeks-list">
                    <!-- Loaded dynamically via JS -->
                </ul>
            </div>
        </aside>

        <!-- Main Form Panel -->
        <section class="admin-main-panel">
            
            <!-- Subsections Navigation -->
            <div class="list-sections-tabs">
                <button class="section-tab active" onclick="switchSectionTab('oraciones-tab', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="svg-icon" style="margin-right:6px;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></svg> Oraciones</button>
                <button class="section-tab" onclick="switchSectionTab('flores-tab', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="svg-icon" style="margin-right:6px;"><circle cx="12" cy="12" r="3"/><path d="M12 2a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 4-4 4 4 0 0 0-4-4z"/><path d="M12 14a4 4 0 0 0-4 4 4 4 0 0 0 4 4 4 4 0 0 0 4-4 4 4 0 0 0-4-4z"/><path d="M6 12a4 4 0 0 0 4-4 4 4 0 0 0 4 4 4 4 0 0 0-4 4 4 4 0 0 0-4-4z"/><path d="M14 12a4 4 0 0 0 4-4 4 4 0 0 0 4 4 4 4 0 0 0-4 4 4 4 0 0 0-4-4z"></svg> Flores</button>
                <button class="section-tab" onclick="switchSectionTab('ventas-tab', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="svg-icon" style="margin-right:6px;"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"></svg> Venta de Comida</button>
            </div>

            <!-- SECTION 1: ORACIONES FORM -->
            <div class="form-section-container active" id="oraciones-tab">
                <div class="form-row-grid" id="oraciones-form-grid">
                    <!-- Day cards (Lunes-Domingo) will be loaded dynamically here -->
                </div>
            </div>

            <!-- SECTION 2: FLORES FORM -->
            <div class="form-section-container" id="flores-tab">
                <div class="form-vertical-stack" id="flores-form-grid">
                    <!-- 3 Sundays cards will be loaded dynamically here -->
                </div>
            </div>

            <!-- SECTION 3: VENTA DE COMIDA FORM -->
            <div class="form-section-container" id="ventas-tab">
                <div class="form-vertical-stack" id="ventas-form-grid">
                    <!-- 5 Sundays Rotation card inputs loaded here -->
                </div>
            </div>
        </section>
    </main>

    <!-- ---------------------------------------------------- -->
    /* DYNAMIC SIGNAGE Loop Screen (Loops in 16:9 full screen) */
    <!-- ---------------------------------------------------- -->
    <div id="signage-player">
        <!-- Invisible bottom-left corner close box to exit signage loop -->
        <div onclick="exitSignage()" style="position: fixed; bottom: 0; left: 0; width: 85px; height: 85px; cursor: default; z-index: 100000; opacity: 0; background: red;"></div>
        
        <!-- Slide 1: Oraciones 5 AM -->
        <div class="signage-slide active" id="slide-oraciones-5">
            <div class="signage-frame" id="frame-oraciones-5"></div>
        </div>

        <!-- Slide 2: Oraciones 9 AM -->
        <div class="signage-slide next" id="slide-oraciones-9">
            <div class="signage-frame" id="frame-oraciones-9"></div>
        </div>

        <!-- Slide 3: Oraciones Tarde -->
        <div class="signage-slide next" id="slide-oraciones-tarde">
            <div class="signage-frame" id="frame-oraciones-tarde"></div>
        </div>

        <!-- Slide 4: Flores -->
        <div class="signage-slide next" id="slide-flores">
            <div class="signage-frame" id="frame-flores"></div>
        </div>

        <!-- Slide 5: Ventas -->
        <div class="signage-slide next" id="slide-ventas">
            <div class="signage-frame" id="frame-ventas"></div>
        </div>
    </div>

    <!-- ---------------------------------------------------- -->
    <!-- OFFSCREEN COMPILED FLYERS FOR 4K DOWNLOAD GENERATION -->
    <!-- ---------------------------------------------------- -->
    <div class="render-offscreen" id="offscreen-render-area">
        <!-- Temporary rendered elements will be loaded here dynamically via JS during zip compiling -->
    </div>

    <!-- ---------------------------------------------------- -->
    <!-- JAVASCRIPT LOGIC & APP ENGINE                        -->
    <!-- ---------------------------------------------------- -->
    <script src="js/app.js"></script>
</body>
</html>
